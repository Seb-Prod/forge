version: '3.8'

services:
  mysql:
    image: mysql:8.2
    container_name: menu_zen_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: menu_zen2
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - monorepo-network
    healthcheck:
      test: >
        bash -c "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"
      timeout: 20s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: menu_zen_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - monorepo-network

volumes:
  mysql_data:
    driver: local

networks:
  monorepo-network:
    driver: bridge